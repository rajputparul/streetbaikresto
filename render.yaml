services:
  - type: web
    name: streetbaik
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn streetbaik.wsgi:application
    envVars:
      - key: DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SITE_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: streetbaik-db
          property: connectionString
      - key: DELIVERY_RADIUS_KM
        value: "4"
      - key: CLIENT_WHATSAPP
        sync: false

databases:
  - name: streetbaik-db
    plan: starter
